user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ============================================================================
  # Logging Configuration
  # ============================================================================
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  log_format json_combined escape=json
  '{'
    '"time_local":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"request":"$request",'
    '"status": "$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_forwarded_for":"$http_x_forwarded_for",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_response_time":"$upstream_response_time"'
  '}';

  access_log /var/log/nginx/access.log json_combined;

  # ============================================================================
  # Performance & Optimization
  # ============================================================================
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 100M;

  # ============================================================================
  # Gzip Compression
  # ============================================================================
  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/json application/javascript;
  gzip_disable "msie6";
  gzip_comp_level 6;

  # ============================================================================
  # Rate Limiting Configuration
  # ============================================================================
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=1000r/m;

  # ============================================================================
  # Upstream Backend Configuration
  # ============================================================================
  upstream backend_api {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # ============================================================================
  # Upstream Frontend Configuration
  # ============================================================================
  upstream frontend_app {
    server frontend:3000;
    keepalive 32;
  }

  # ============================================================================
  # Cache Configuration
  # ============================================================================
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m max_size=5g inactive=30d use_temp_path=off;

  # ============================================================================
  # SSL Configuration (optional, uncomment for production)
  # ============================================================================
  # ssl_protocols TLSv1.2 TLSv1.3;
  # ssl_ciphers HIGH:!aNULL:!MD5;
  # ssl_prefer_server_ciphers on;
  # ssl_session_cache shared:SSL:10m;
  # ssl_session_timeout 10m;

  # ============================================================================
  # Development Server Configuration
  # ============================================================================
  server {
    listen 80 default_server;
    server_name _;

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # API Routes - FastAPI Backend
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;

      proxy_pass http://backend_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # Caching for GET requests (5 minutes)
      proxy_cache api_cache;
      proxy_cache_valid 200 5m;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_bypass $http_cache_control;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # WebSocket endpoint
    location /ws/ {
      limit_req zone=api_limit burst=20 nodelay;

      proxy_pass http://backend_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
    }

    # Static assets - caching headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      proxy_pass http://frontend_app;
      proxy_cache static_cache;
      proxy_cache_valid 200 30d;
      expires 30d;
      add_header Cache-Control "public, immutable";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Frontend React app - all other routes
    location / {
      proxy_pass http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # React Router: serve index.html for SPA
      try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
  }

  # Include additional configuration files
  include /etc/nginx/conf.d/*.conf;
}
