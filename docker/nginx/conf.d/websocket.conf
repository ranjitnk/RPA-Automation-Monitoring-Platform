# ============================================================================
# Nginx WebSocket Configuration
# ============================================================================
# This file configures routing for WebSocket connections (real-time updates).

upstream websocket_backend {
    server backend:8000;
    keepalive 64;
}

# Rate limiting zones for WebSocket connections
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

# ============================================================================
# WebSocket Endpoint Configuration
# ============================================================================
location /ws/ {
    # Rate limiting for WebSocket connections
    limit_req zone=ws_limit burst=20 nodelay;

    # Proxy configuration for WebSocket
    proxy_pass http://websocket_backend;
    proxy_http_version 1.1;

    # WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Connection "Upgrade";

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Request-ID $request_id;

    # WebSocket timeouts (keep connections alive longer)
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_connect_timeout 60;

    # Disable buffering for WebSocket
    proxy_buffering off;

    # WebSocket specific settings
    proxy_cache off;
    proxy_request_buffering off;

    # Keep-alive settings
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # CORS headers for WebSocket
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Credentials true always;
}

# ============================================================================
# WebSocket Endpoint - Real-time Jobs
# ============================================================================
location /ws/jobs/ {
    limit_req zone=ws_limit burst=20 nodelay;

    proxy_pass http://websocket_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
    proxy_cache off;
}

