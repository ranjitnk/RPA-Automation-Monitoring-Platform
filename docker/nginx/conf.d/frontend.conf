# ============================================================================
# Nginx Frontend Configuration
# ============================================================================
# This file configures routing for the React frontend application.

upstream frontend_app {
    server frontend:3000;
    keepalive 32;
}

# Cache zone for static assets
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m max_size=5g inactive=30d use_temp_path=off;

# ============================================================================
# Static Assets - Aggressively Cached
# ============================================================================
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # Cache for 30 days
    proxy_cache static_cache;
    proxy_cache_valid 200 30d;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Cache-Status $upstream_cache_status;

    # Allow stale cache while updating
    proxy_cache_use_stale error timeout updating;
    proxy_cache_background_update on;
    proxy_cache_lock on;
}

# ============================================================================
# HTML Files - Shorter Cache
# ============================================================================
location ~* \.(html|htm)$ {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache for 5 minutes (allows updates without full invalidation)
    proxy_cache static_cache;
    proxy_cache_valid 200 5m;
    expires 5m;
    add_header Cache-Control "public, max-age=300";
    add_header X-Cache-Status $upstream_cache_status;
}

# ============================================================================
# Frontend SPA Routes
# ============================================================================
location / {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # No caching for SPA
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;

    # React Router: serve index.html for all routes
    try_files $uri $uri/ /index.html;
}

# ============================================================================
# Favicon - Special Handling
# ============================================================================
location = /favicon.ico {
    proxy_pass http://frontend_app;
    proxy_cache static_cache;
    proxy_cache_valid 200 30d;
    expires 30d;
    access_log off;
}

# ============================================================================
# Robots.txt - SEO
# ============================================================================
location = /robots.txt {
    proxy_pass http://frontend_app;
    proxy_cache static_cache;
    proxy_cache_valid 200 24h;
    expires 24h;
    access_log off;
}
