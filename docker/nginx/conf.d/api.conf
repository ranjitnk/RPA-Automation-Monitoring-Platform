# ============================================================================
# Nginx API Configuration
# ============================================================================
# This file configures routing for the FastAPI backend.

upstream backend_api {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# API rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $http_x_forwarded_for zone=api_limit_xff:10m rate=100r/m;

# Cache zones for API responses
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

# ============================================================================
# API Location Configuration
# ============================================================================
location /api/v1/ {
    # Rate limiting
    limit_req zone=api_limit burst=50 nodelay;
    limit_req_status 429;

    # Proxy configuration
    proxy_pass http://backend_api;
    proxy_http_version 1.1;

    # Connection management
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Request-ID $request_id;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;

    # Cache GET requests (5 minutes)
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 304 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";
    proxy_cache_bypass $http_cache_control $http_pragma $cookie__cache_bypass;
    proxy_cache_use_stale error timeout invalid_header updating;
    add_header X-Cache-Status $upstream_cache_status;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # CORS headers (handled by backend)
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS, POST, PUT, DELETE, PATCH" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    add_header Access-Control-Allow-Credentials true always;
}

# ============================================================================
# Health Check Endpoint
# ============================================================================
location /api/v1/health {
    access_log off;
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
}

# ============================================================================
# Metrics Endpoint (Prometheus)
# ============================================================================
location /api/v1/metrics {
    # Restrict metrics access to internal IPs only (optional)
    allow 127.0.0.1;
    allow 172.30.0.0/16;  # Docker network
    deny all;

    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
