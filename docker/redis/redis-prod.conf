# ============================================================================
# Redis Production Configuration
# ============================================================================
# Optimized for production environments with maximum reliability and performance.

# ============================================================================
# Network Configuration
# ============================================================================

bind 0.0.0.0
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ============================================================================
# Memory Management (Production)
# ============================================================================

# Increase for production workloads
maxmemory 4gb

# Use volatile-lru for session store (only evict keys with TTL)
maxmemory-policy volatile-lru

maxmemory-samples 10

# ============================================================================
# Persistence Configuration (Production)
# ============================================================================

# More aggressive saving for critical data
save 60 10000
save 300 100
save 900 1

# Critical: always sync to disk
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

dbfilename dump.rdb
dir /data

# ============================================================================
# AOF Configuration (Production)
# ============================================================================

# Always use AOF in production
appendonly yes
appendfilename "appendonly.aof"

# More conservative fsync policy for performance
appendfsync everysec

# Rewrite when 100% growth or 256MB
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb

no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes

# ============================================================================
# Logging (Production)
# ============================================================================

loglevel warning
logfile ""
syslog-enabled no

# ============================================================================
# Replication (Production)
# ============================================================================

# Master server
role master
port 6379

# ============================================================================
# Slow Log (Production)
# ============================================================================

# Log queries slower than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 256

# ============================================================================
# Latency Monitor (Production)
# ============================================================================

# Monitor latency issues
latency-monitor-threshold 0

# ============================================================================
# Event Notifications
# ============================================================================

# Enable all notifications for monitoring/debugging
notify-keyspace-events "AKE"

# ============================================================================
# Advanced Settings (Production)
# ============================================================================

hash-max-ziplist-entries 512
hash-max-ziplist-value 64

list-max-ziplist-size -2
list-compress-depth 0

set-max-intset-entries 512

zset-max-ziplist-entries 128
zset-max-ziplist-value 64

hll-sparse-max-bytes 3000

stream-node-max-bytes 4096
stream-node-max-entries 100

activerehashing yes

client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 512mb 128mb 120
client-output-buffer-limit pubsub 64mb 16mb 120

# ============================================================================
# Frequency Configuration
# ============================================================================

hz 10
dynamic-hz yes

# ============================================================================
# Security (Production)
# ============================================================================

# Use environment variable for password via Docker
# requirepass $REDIS_PASSWORD

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command SHUTDOWN SHUTDOWN_PROD

# ============================================================================
# EOF
# ============================================================================
