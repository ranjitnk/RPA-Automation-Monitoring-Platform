# ============================================================================
# Redis Configuration
# ============================================================================
# Production-ready Redis configuration for caching, sessions, and queues.

# ============================================================================
# Network Configuration
# ============================================================================

# Accept connections on all interfaces (Docker container)
bind 0.0.0.0

# TCP listen() backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

# Close client connection if client is idle for N seconds
timeout 0

# ============================================================================
# Memory Management
# ============================================================================

# Maximum memory Redis can use
maxmemory 2gb

# Memory eviction policy when max memory is reached
# Options: noeviction, allkeys-lru, allkeys-lfu, volatile-lru, volatile-lfu, volatile-random, allkeys-random, volatile-ttl
# Recommended: allkeys-lru (for cache) or volatile-lru (for session store with TTL)
maxmemory-policy allkeys-lru

# Samples used for LRU/LFU eviction (higher = more accurate but slower)
maxmemory-samples 5

# ============================================================================
# Persistence Configuration
# ============================================================================

# Save snapshots to disk
# Format: save <seconds> <changes>
# Save if 10000 keys have changed in 60 seconds
save 60 10000

# Save if 100 keys have changed in 300 seconds
save 300 100

# Save if 1 key has changed in 900 seconds
save 900 1

# Stop writes if background save fails
stop-writes-on-bgsave-error yes

# Compress string objects in RDB (AOF uses LZF for strings)
rdbcompression yes

# Checksum RDB file
rdbchecksum yes

# RDB file name
dbfilename dump.rdb

# Directory for RDB files
dir /data

# ============================================================================
# AOF (Append-Only File) Configuration
# ============================================================================

# Enable AOF persistence
appendonly yes

# AOF file name
appendfilename "appendonly.aof"

# How often to fsync the AOF file
# Options: always, everysec, no
# Recommended: everysec (balance between safety and performance)
appendfsync everysec

# Prevent fsync during rewrites
no-appendfsync-on-rewrite no

# Auto rewrite AOF when size reaches specified percentage
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# AOF format version
aof-use-rdb-preamble yes

# ============================================================================
# Logging Configuration
# ============================================================================

# Log level
# Options: debug, verbose, notice, warning
loglevel notice

# Log file
logfile ""

# Syslog
syslog-enabled no
syslog-ident redis
syslog-facility local0

# ============================================================================
# Replication Configuration
# ============================================================================

# Role: master, slave, sentinel
role master

# Max number of simultaneous clients
maxclients 10000

# ============================================================================
# Slow Log Configuration
# ============================================================================

# Log queries slower than specified microseconds (0 = all commands, -1 = disabled)
slowlog-log-slower-than 10000

# Max length of slow log
slowlog-max-len 128

# ============================================================================
# Latency Monitor
# ============================================================================

# Enable latency monitoring (microseconds, 0 = disabled)
latency-monitor-threshold 0

# ============================================================================
# Event Notification (Keyspace Notifications)
# ============================================================================

# Enable keyspace notifications for event subscriptions
# K = Keyspace events
# E = Events
# g = Generic
# $ = String commands
# l = List commands
# s = Set commands
# z = Sorted set commands
# x = Stream commands
# t = Stream consumer group commands
# d = Stream commands (other)
# A = Alias for "g$lsxztd" (all data events)
notify-keyspace-events ""

# ============================================================================
# Advanced Configuration
# ============================================================================

# Hash table settings for better memory usage
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog
hll-sparse-max-bytes 3000

# Stream settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# HZ (frequency of background jobs)
hz 10

# Enable dynamic HZ
dynamic-hz yes

# ============================================================================
# Security Configuration
# ============================================================================

# Require password (if not in Docker with network isolation)
# requirepass your_password_here

# Rename dangerous commands (optional)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# ============================================================================
# Modules
# ============================================================================

# Load modules
# loadmodule /usr/lib/redis/modules/module.so

# ============================================================================
# ACL (Access Control List)
# ============================================================================

# Load ACL rules from file
# aclfile /etc/redis/users.acl

# ============================================================================
# EOF
# ============================================================================
