version: '3.9'

# Production-grade Docker Compose configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # ============================================================================
  # PostgreSQL Database - Production Setup
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: observability_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: >
        -c shared_preload_libraries=pg_stat_statements
        -c log_min_duration_statement=1000
        -c log_connections=on
        -c log_disconnections=on
        -c max_connections=200
        -c shared_buffers=4GB
        -c effective_cache_size=12GB
        -c maintenance_work_mem=1GB
        -c work_mem=256MB
        -c wal_level=replica
        -c archive_mode=on
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backend/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups/postgres:/backups
    networks:
      - observability_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=postgres"
    restart: always
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Redis Cache - Production Setup
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: observability_redis_prod
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data_prod:/data
    networks:
      - observability_network_prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=redis"
    restart: always
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # ElasticSearch - Production Setup
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: observability_elasticsearch_prod
    environment:
      - node.name=es-node-1
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.ml.enabled=true
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - elasticsearch_data_prod:/usr/share/elasticsearch/data
    networks:
      - observability_network_prod
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q 'status' && echo 0 || echo 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=elasticsearch"
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ============================================================================
  # Kibana - Production Setup
  # ============================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: observability_kibana_prod
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_DEFAULTAPPID: discover
    networks:
      - observability_network_prod
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'kibana' && echo 0 || echo 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=kibana"
    restart: always
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # FastAPI Backend - Production Setup
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: production
      LOG_LEVEL: WARNING
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - observability_network_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=backend"
    restart: always
    security_opt:
      - no-new-privileges:true
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w ${WORKERS:-4} -b 0.0.0.0:8000

  # ============================================================================
  # React Frontend - Production Setup
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    networks:
      - observability_network_prod
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=frontend"
    restart: always
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Nginx Reverse Proxy - Production Setup
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: observability_nginx_prod
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache_prod:/var/cache/nginx
    networks:
      - observability_network_prod
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=nginx"
    restart: always
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  elasticsearch_data_prod:
    driver: local
  nginx_cache_prod:
    driver: local

networks:
  observability_network_prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
