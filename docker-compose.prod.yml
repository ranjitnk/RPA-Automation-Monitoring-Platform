# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  backend:
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000
    volumes: []
    env_file:
      - ./backend/.env

  frontend:
    build:
      target: production
    ports:
      - "80:80"
    volumes: []

  kibana:
    profiles: []
